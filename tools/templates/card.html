<a class="news-card work-card" href="{{href}}">
  <div class="news-card-img"><img src="{{img}}" alt="{{alt}}" loading="lazy" decoding="async" width="640" height="480"></div>
  <div class="news-card-body">
    <time class="news-card-date" datetime="{{date_iso}}">{{date}}</time>
    <h3 class="work-card-title">{{title}}</h3>
    <p class="news-card-text">{{excerpt}}</p>
    <span class="news-card-link">Читати повністю →</span>
  </div>
</a>
