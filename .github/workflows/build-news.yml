name: Build «Наші роботи»

# Раз на кілька годин збирає сторінки розділу «Наші роботи» з постів Google-профілю
# (через бекенд), оновлює 3 останні роботи на головній і, якщо щось змінилось,
# комітить — GitHub Pages сам викладе сайт.
on:
  schedule:
    - cron: "17 */3 * * *"   # кожні 3 години (GitHub може запускати із затримкою)
  workflow_dispatch:          # кнопка «Run workflow» для ручного запуску

permissions:
  contents: write

concurrency:
  group: build-news
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build pages
        run: python3 tools/build_news.py

      - name: Commit changes
        run: |
          git add roboty sitemap.xml index.html
          if git diff --cached --quiet; then
            echo "Змін немає."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Оновлено «Наші роботи»"
          git push
