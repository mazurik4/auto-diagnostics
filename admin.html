<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Адмінка новин — Автодіагностика Київ</title>
<meta name="robots" content="noindex, nofollow">

<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">

<style>
  .admin-wrap{max-width:640px;margin:0 auto;padding:56px 24px 100px;}
  .admin-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px;margin-bottom:24px;}
  .admin-title{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.03em;font-size:1.3rem;color:var(--paper);margin:0 0 6px;}
  .admin-sub{color:var(--paper-dim);font-size:.88rem;margin:0 0 20px;}
  .admin-field{display:block;margin-bottom:16px;}
  .admin-field span{display:block;font-size:.82rem;color:var(--paper-dim);margin-bottom:6px;}
  .admin-field input[type="text"],
  .admin-field input[type="password"],
  .admin-field textarea{
    width:100%;background:var(--ink);border:1px solid var(--line-strong);border-radius:8px;
    padding:12px 14px;color:var(--paper);font-family:inherit;font-size:.92rem;resize:vertical;
  }
  .admin-field input:focus,.admin-field textarea:focus{border-color:var(--signal);outline:none;}
  .admin-counter{text-align:right;font-size:.76rem;color:var(--steel);margin-top:4px;}
  .admin-preview{width:160px;height:120px;border-radius:8px;overflow:hidden;background:var(--ink-2);border:1px solid var(--line);margin-top:10px;display:none;}
  .admin-preview img{width:100%;height:100%;object-fit:cover;display:block;}
  .admin-msg{font-size:.86rem;margin-top:14px;display:none;}
  .admin-msg.ok{color:#3ddc6f;display:block;}
  .admin-msg.err{color:#ff6b5e;display:block;}
  .admin-list{display:flex;flex-direction:column;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;}
  .admin-item{background:var(--surface);padding:16px;display:flex;gap:14px;align-items:center;}
  .admin-item img{width:64px;height:48px;object-fit:cover;border-radius:6px;flex:none;background:var(--ink-2);}
  .admin-item p{margin:0;font-size:.86rem;color:var(--paper-dim);flex:1;line-height:1.4;}
  .admin-item .admin-date{display:block;font-family:'Space Mono',monospace;font-size:.7rem;color:var(--steel);margin-bottom:4px;}
  .admin-empty{color:var(--steel);font-size:.88rem;padding:8px 0;}
  .admin-del{
    flex:none;background:none;border:1px solid var(--line-strong);color:#ff6b5e;
    border-radius:6px;padding:8px 12px;font-size:.8rem;cursor:pointer;font-family:inherit;
  }
  .admin-del:hover{background:rgba(255,107,94,.1);}
  .btn-block{width:100%;justify-content:center;}
  [hidden]{display:none !important;}
</style>
</head>
<body style="background:var(--ink);">

<div class="admin-wrap">

  <!-- ЕКРАН ВХОДУ -->
  <div class="admin-card" id="gateCard">
    <h1 class="admin-title">Адмінка новин</h1>
    <p class="admin-sub">Введіть ключ доступу (той самий ADMIN_KEY, що й для заявок).</p>
    <label class="admin-field">
      <span>Ключ доступу</span>
      <input type="password" id="gateKey" autocomplete="off">
    </label>
    <button type="button" class="btn btn-primary btn-block" id="gateBtn">Увійти</button>
    <div class="admin-msg err" id="gateMsg"></div>
  </div>

  <!-- ФОРМА ТА СПИСОК — з'являються після входу -->
  <div id="adminArea" hidden>

    <div class="admin-card">
      <h1 class="admin-title">Додати новину</h1>
      <p class="admin-sub">Фото + короткий текст. Публікується одразу на сайт, найстаріша новина понад ліміт (5) видаляється автоматично.</p>

      <label class="admin-field">
        <span>Фото</span>
        <input type="file" id="newsImage" accept="image/*">
        <div class="admin-preview" id="newsPreview"><img id="newsPreviewImg" alt=""></div>
      </label>

      <label class="admin-field">
        <span>Текст новини</span>
        <textarea id="newsText" rows="4" maxlength="300" placeholder="Що зробили, що сталось цікавого..."></textarea>
        <div class="admin-counter"><span id="newsTextCount">0</span>/300</div>
      </label>

      <button type="button" class="btn btn-primary btn-block" id="publishBtn">Опублікувати</button>
      <div class="admin-msg" id="publishMsg"></div>
    </div>

    <div class="admin-card">
      <h1 class="admin-title">Поточні новини</h1>
      <div class="admin-list" id="newsList"></div>
      <div class="admin-empty" id="newsEmpty" hidden>Новин ще немає — додайте першу вище.</div>
    </div>

  </div>

</div>

<script>
(function(){
  let API_URL = 'https://backend-cmr4.onrender.com';
  let KEY_STORAGE = 'adminKey';

  let gateCard = document.getElementById('gateCard');
  let adminArea = document.getElementById('adminArea');
  let gateKey = document.getElementById('gateKey');
  let gateBtn = document.getElementById('gateBtn');
  let gateMsg = document.getElementById('gateMsg');

  function adminKey(){ return sessionStorage.getItem(KEY_STORAGE) || ''; }

  function showAdmin(){
    gateCard.hidden = true;
    adminArea.hidden = false;
    loadNews();
  }

  gateBtn.addEventListener('click', function(){
    let key = gateKey.value.trim();
    if(!key) return;
    sessionStorage.setItem(KEY_STORAGE, key);
    gateMsg.style.display = 'none';
    showAdmin();
  });
  gateKey.addEventListener('keydown', function(e){
    if(e.key === 'Enter') gateBtn.click();
  });

  function handleAuthError(){
    sessionStorage.removeItem(KEY_STORAGE);
    adminArea.hidden = true;
    gateCard.hidden = false;
    gateMsg.textContent = 'Невірний ключ доступу';
    gateMsg.style.display = 'block';
  }

  // ---------- превью фото ----------
  let imageInput = document.getElementById('newsImage');
  let preview = document.getElementById('newsPreview');
  let previewImg = document.getElementById('newsPreviewImg');
  imageInput.addEventListener('change', function(){
    let file = imageInput.files[0];
    if(!file){ preview.style.display = 'none'; return; }
    previewImg.src = URL.createObjectURL(file);
    preview.style.display = 'block';
  });

  // ---------- лічильник тексту ----------
  let textArea = document.getElementById('newsText');
  let textCount = document.getElementById('newsTextCount');
  textArea.addEventListener('input', function(){
    textCount.textContent = textArea.value.length;
  });

  // ---------- публікація ----------
  let publishBtn = document.getElementById('publishBtn');
  let publishMsg = document.getElementById('publishMsg');

  publishBtn.addEventListener('click', function(){
    let text = textArea.value.trim();
    let file = imageInput.files[0];
    publishMsg.className = 'admin-msg';
    publishMsg.style.display = 'none';

    if(!text){ showMsg(publishMsg, 'Додайте текст новини', 'err'); return; }
    if(!file){ showMsg(publishMsg, 'Додайте фото', 'err'); return; }

    let fd = new FormData();
    fd.append('text', text);
    fd.append('image', file);

    publishBtn.disabled = true;
    fetch(API_URL + '/api/news', {
      method: 'POST',
      headers: { 'X-Admin-Key': adminKey() },
      body: fd
    })
      .then(function(r){
        if(r.status === 401){ handleAuthError(); throw new Error('auth'); }
        if(!r.ok) return r.json().then(function(d){ throw new Error(d.detail || 'Помилка'); });
        return r.json();
      })
      .then(function(){
        textArea.value = '';
        textCount.textContent = '0';
        imageInput.value = '';
        preview.style.display = 'none';
        showMsg(publishMsg, '✓ Новину опубліковано', 'ok');
        loadNews();
      })
      .catch(function(err){
        if(err.message !== 'auth') showMsg(publishMsg, err.message, 'err');
      })
      .finally(function(){
        publishBtn.disabled = false;
      });
  });

  function showMsg(el, text, kind){
    el.textContent = text;
    el.className = 'admin-msg ' + kind;
    el.style.display = 'block';
  }

  // ---------- список новин ----------
  let listEl = document.getElementById('newsList');
  let emptyEl = document.getElementById('newsEmpty');

  function loadNews(){
    fetch(API_URL + '/api/news')
      .then(function(r){ return r.ok ? r.json() : []; })
      .then(renderList)
      .catch(function(){});
  }

  function renderList(items){
    listEl.innerHTML = '';
    emptyEl.hidden = !!(items && items.length);
    if(!items || !items.length) return;

    items.forEach(function(item){
      let row = document.createElement('div');
      row.className = 'admin-item';

      let img = document.createElement('img');
      img.src = API_URL + item.image_url;
      img.alt = '';

      let p = document.createElement('p');
      let date = document.createElement('span');
      date.className = 'admin-date';
      date.textContent = new Date(item.created_at).toLocaleString('uk-UA');
      p.appendChild(date);
      p.appendChild(document.createTextNode(item.text));

      let del = document.createElement('button');
      del.type = 'button';
      del.className = 'admin-del';
      del.textContent = 'Видалити';
      del.addEventListener('click', function(){
        if(!confirm('Видалити цю новину?')) return;
        fetch(API_URL + '/api/news/' + item.id, {
          method: 'DELETE',
          headers: { 'X-Admin-Key': adminKey() }
        })
          .then(function(r){
            if(r.status === 401){ handleAuthError(); return; }
            loadNews();
          });
      });

      row.appendChild(img);
      row.appendChild(p);
      row.appendChild(del);
      listEl.appendChild(row);
    });
  }

  // ---------- автовхід, якщо ключ вже збережено в цій вкладці ----------
  if(adminKey()) showAdmin();
})();
</script>
</body>
</html>
